<!DOCTYPE html>
<html lang="en">

{%- include head.html -%}

<body>
    <main class="stage">
        <div class="scene">
            <div class="shadow" aria-hidden="true"></div>
            <div class="card" id="card">
                <div class="face face-front">
                    <div class="card-inner front-inner">
                        <div class="portrait">
                            <img src="{{ "/assets/images/me.webp" | relative_url }}" alt="{{ site.name }}" draggable="false" />
                        </div>
                        <div class="details">
                            <h1 class="name">{{ site.name }}</h1>
                            <p class="role">{{ site.job-title }}</p>
                            <ul class="links">
                                <li>
                                    <a href="https://github.com/{{ site.github }}" rel="noopener">
                                        <img src="{{ "/assets/images/github.svg" | relative_url }}" alt="" draggable="false" />
                                        <span>@{{ site.github }}</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="https://www.linkedin.com/in/{{ site.linkedin }}/" rel="noopener">
                                        <img src="{{ "/assets/images/linkedin.svg" | relative_url }}" alt="" draggable="false" />
                                        <span>/{{ site.linkedin }}</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="mailto:{{ site.email }}">
                                        <img src="{{ "/assets/images/email.svg" | relative_url }}" alt="" draggable="false" />
                                        <span>{{ site.email }}</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="face face-back">
                    <div class="card-inner back-inner">
                        <p class="back-label">Selected work</p>
                        <ul class="projects">
                            <li><span class="year">2024</span><span class="proj">Claude Raycast Extension</span></li>
                            <li><span class="year">2023</span><span class="proj">MCD Capital &middot; Automated trading</span></li>
                            <li><span class="year">2023</span><span class="proj">MCFC &times; Hays &middot; OptiSub</span></li>
                            <li><span class="year">'19&ndash;'22</span><span class="proj">Code4Community</span></li>
                        </ul>
                        <p class="back-mark">FD</p>
                    </div>
                </div>
                <div class="face face-top"></div>
                <div class="face face-bottom"></div>
                <div class="face face-left"></div>
                <div class="face face-right"></div>
            </div>
        </div>
    </main>

    <script>
        (function () {
            const card = document.getElementById('card');
            const shadow = document.querySelector('.shadow');

            // baseX/Y is the rotation set by drag (and decaying inertia). The displayed
            // rotation is base + parallax offset; parallax tilts within ±a few degrees on
            // top of whatever the user has dragged to, without snapping it back.
            let baseX = 0, baseY = 0;
            let pxlX = 0, pxlY = 0;
            let targetPxlX = 0, targetPxlY = 0;
            let velX = 0, velY = 0;

            let isPointerDown = false;
            let dragged = false;
            let pointerId = null;
            let startX = 0, startY = 0;
            let lastX = 0, lastY = 0, lastT = 0;

            const DRAG_THRESHOLD = 5;
            const SENSITIVITY = 0.45;
            const FRICTION = 0.94;
            const PARALLAX_RX = 2.0;       // max ° tilt on X axis from pointer position
            const PARALLAX_RY = 3.5;       // max ° tilt on Y axis from pointer position

            function applyTransform() {
                const rotX = baseX + pxlX;
                const rotY = baseY + pxlY;
                card.style.transform =
                    'rotateX(' + rotX.toFixed(3) + 'deg) ' +
                    'rotateY(' + rotY.toFixed(3) + 'deg)';

                if (shadow) {
                    const X = rotX * Math.PI / 180;
                    const Y = rotY * Math.PI / 180;
                    const sX = Math.sin(X), cX = Math.cos(X);
                    const sY = Math.sin(Y), cY = Math.cos(Y);
                    const tilt = Math.max(Math.abs(sX), Math.abs(sY));
                    // Visible shadow scales with the card's projected silhouette —
                    // when edge-on its profile is essentially zero.
                    const vis = Math.abs(cX * cY);
                    shadow.style.setProperty('--shadow-dx', (-sY * 22).toFixed(1) + 'px');
                    shadow.style.setProperty('--shadow-dy', (sX * 18).toFixed(1) + 'px');
                    shadow.style.setProperty('--shadow-spread', (tilt * 14).toFixed(1) + 'px');
                    shadow.style.setProperty('--shadow-vis', vis.toFixed(3));
                }
            }

            applyTransform();

            function onDown(e) {
                if (e.button !== undefined && e.button !== 0) return;
                isPointerDown = true;
                dragged = false;
                pointerId = e.pointerId;
                startX = lastX = e.clientX;
                startY = lastY = e.clientY;
                lastT = performance.now();
                velX = 0;
                velY = 0;
            }

            function onMove(e) {
                if (!isPointerDown || e.pointerId !== pointerId) return;

                const totalDX = e.clientX - startX;
                const totalDY = e.clientY - startY;

                if (!dragged && Math.hypot(totalDX, totalDY) > DRAG_THRESHOLD) {
                    dragged = true;
                    card.classList.add('dragging');
                    try { card.setPointerCapture(pointerId); } catch (err) { /* noop */ }
                }

                if (dragged) {
                    const now = performance.now();
                    const dt = Math.max(8, now - lastT);
                    const dx = e.clientX - lastX;
                    const dy = e.clientY - lastY;

                    baseY += dx * SENSITIVITY;
                    baseX -= dy * SENSITIVITY;

                    velY = (dx * SENSITIVITY) / dt;
                    velX = -(dy * SENSITIVITY) / dt;

                    lastX = e.clientX;
                    lastY = e.clientY;
                    lastT = now;

                    applyTransform();
                    e.preventDefault();
                }
            }

            function onUp(e) {
                if (!isPointerDown) return;
                isPointerDown = false;
                card.classList.remove('dragging');
                if (pointerId !== null) {
                    try { card.releasePointerCapture(pointerId); } catch (err) { /* noop */ }
                }
                pointerId = null;
            }

            card.addEventListener('pointerdown', onDown);
            card.addEventListener('pointermove', onMove);
            card.addEventListener('pointerup', onUp);
            card.addEventListener('pointercancel', onUp);

            card.addEventListener('click', function (e) {
                if (dragged) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);

            card.addEventListener('dragstart', function (e) { e.preventDefault(); });

            // Pointer-follow parallax: the card subtly tilts a few degrees toward the
            // cursor — but as an offset on top of whatever the user has dragged to,
            // not a replacement.
            window.addEventListener('pointermove', function (e) {
                if (e.pointerType === 'touch') return;
                if (isPointerDown) return;
                const dx = (e.clientX / window.innerWidth)  - 0.5;
                const dy = (e.clientY / window.innerHeight) - 0.5;
                targetPxlY =  dx * 2 * PARALLAX_RY;
                targetPxlX = -dy * 2 * PARALLAX_RX;
            });

            let lastFrame = performance.now();
            function loop(now) {
                const frameDt = Math.min(50, now - lastFrame);
                lastFrame = now;

                let needsUpdate = false;

                if (!isPointerDown) {
                    const speed = Math.hypot(velX, velY);
                    if (speed > 0.0008) {
                        // Inertia decays on the base rotation, leaving the card wherever it lands.
                        baseX += velX * frameDt;
                        baseY += velY * frameDt;
                        const decay = Math.pow(FRICTION, frameDt / 16);
                        velX *= decay;
                        velY *= decay;
                        needsUpdate = true;
                    }
                }

                // Parallax always lerps — independent of base, runs even during drag/inertia.
                const dPX = targetPxlX - pxlX;
                const dPY = targetPxlY - pxlY;
                if (Math.abs(dPX) > 0.005 || Math.abs(dPY) > 0.005) {
                    const lerp = 1 - Math.pow(0.88, frameDt / 16);
                    pxlX += dPX * lerp;
                    pxlY += dPY * lerp;
                    needsUpdate = true;
                }

                if (needsUpdate) applyTransform();
                requestAnimationFrame(loop);
            }

            requestAnimationFrame(loop);

            window.addEventListener('blur', function () {
                if (isPointerDown) {
                    isPointerDown = false;
                    card.classList.remove('dragging');
                    pointerId = null;
                }
            });
        })();
    </script>
</body>

</html>
