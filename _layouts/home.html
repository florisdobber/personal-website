<!DOCTYPE html>
<html lang="en">

{%- include head.html -%}

<body>
    <main class="stage">
        <div class="scene">
            <div class="shadow" aria-hidden="true"></div>
            <div class="card" id="card">
                <div class="face face-front">
                    <div class="card-inner front-inner">
                        <span class="monogram" aria-hidden="true">fd.</span>
                        <div class="details">
                            <h1 class="name">{{ site.name }}</h1>
                            <p class="role">{{ site.job-title }}</p>
                        </div>
                    </div>
                </div>
                <div class="face face-back">
                    <div class="card-inner back-inner">
                        <span class="monogram monogram-back" aria-hidden="true">fd.</span>
                        <div class="back-content">
                            <p class="back-label">You found the back.</p>
                            <ul class="links">
                                <li>
                                    <a href="https://github.com/{{ site.github }}" rel="noopener">
                                        <img src="{{ "/assets/images/github.svg" | relative_url }}" alt="" draggable="false" />
                                        <span>@{{ site.github }}</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="https://www.linkedin.com/in/{{ site.linkedin }}/" rel="noopener">
                                        <img src="{{ "/assets/images/linkedin.svg" | relative_url }}" alt="" draggable="false" />
                                        <span>/{{ site.linkedin }}</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="mailto:{{ site.email }}">
                                        <img src="{{ "/assets/images/email.svg" | relative_url }}" alt="" draggable="false" />
                                        <span>{{ site.email }}</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="https://florisdobber.com" rel="noopener">
                                        <img src="{{ "/assets/images/website.svg" | relative_url }}" alt="" draggable="false" />
                                        <span>florisdobber.com</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="face face-top"></div>
                <div class="face face-bottom"></div>
                <div class="face face-left"></div>
                <div class="face face-right"></div>
            </div>
        </div>
    </main>

    <script>
        (function () {
            const card = document.getElementById('card');
            const shadow = document.querySelector('.shadow');

            // baseX/Y is the rotation set by drag (and decaying inertia). The card
            // stays wherever the user lands it after a drag.
            let baseX = 0, baseY = 0;
            let velX = 0, velY = 0;

            let isPointerDown = false;
            let dragged = false;
            let pointerId = null;
            let startX = 0, startY = 0;
            let lastX = 0, lastY = 0, lastT = 0;

            const DRAG_THRESHOLD = 5;
            const SENSITIVITY = 0.45;
            const FRICTION = 0.94;

            // One-time settling wobble on load. Decaying sine on yaw (Y) plus a
            // smaller pitch (X) at a slightly different frequency so peaks don't
            // sync — keeps the motion reading as organic, not mechanical. Cancels
            // on first pointerdown so it never fights user input.
            const INTRO_DURATION_MS = 1300;
            const INTRO_AMP_Y = 5.0;
            const INTRO_AMP_X = 1.8;
            const INTRO_FREQ_Y = 2.6;
            const INTRO_FREQ_X = 3.1;
            const INTRO_DECAY = 3.2;
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let introActive = !prefersReducedMotion;
            let introStart = null;

            function applyTransform() {
                const rotX = baseX;
                const rotY = baseY;
                card.style.transform =
                    'rotateX(' + rotX.toFixed(3) + 'deg) ' +
                    'rotateY(' + rotY.toFixed(3) + 'deg)';

                if (shadow) {
                    const X = rotX * Math.PI / 180;
                    const Y = rotY * Math.PI / 180;
                    const sX = Math.sin(X), cX = Math.cos(X);
                    const sY = Math.sin(Y), cY = Math.cos(Y);
                    const tilt = Math.max(Math.abs(sX), Math.abs(sY));
                    // Visible shadow scales with the card's projected silhouette —
                    // when edge-on its profile is essentially zero.
                    const vis = Math.abs(cX * cY);
                    shadow.style.setProperty('--shadow-dx', (-sY * 22).toFixed(1) + 'px');
                    shadow.style.setProperty('--shadow-dy', (sX * 18).toFixed(1) + 'px');
                    shadow.style.setProperty('--shadow-spread', (tilt * 14).toFixed(1) + 'px');
                    shadow.style.setProperty('--shadow-vis', vis.toFixed(3));
                }
            }

            applyTransform();

            function onDown(e) {
                if (e.button !== undefined && e.button !== 0) return;
                introActive = false;
                isPointerDown = true;
                dragged = false;
                pointerId = e.pointerId;
                startX = lastX = e.clientX;
                startY = lastY = e.clientY;
                lastT = performance.now();
                velX = 0;
                velY = 0;
            }

            function onMove(e) {
                if (!isPointerDown || e.pointerId !== pointerId) return;

                const totalDX = e.clientX - startX;
                const totalDY = e.clientY - startY;

                if (!dragged && Math.hypot(totalDX, totalDY) > DRAG_THRESHOLD) {
                    dragged = true;
                    card.classList.add('dragging');
                    try { card.setPointerCapture(pointerId); } catch (err) { /* noop */ }
                }

                if (dragged) {
                    const now = performance.now();
                    const dt = Math.max(8, now - lastT);
                    const dx = e.clientX - lastX;
                    const dy = e.clientY - lastY;

                    baseY += dx * SENSITIVITY;
                    baseX -= dy * SENSITIVITY;

                    velY = (dx * SENSITIVITY) / dt;
                    velX = -(dy * SENSITIVITY) / dt;

                    lastX = e.clientX;
                    lastY = e.clientY;
                    lastT = now;

                    applyTransform();
                    e.preventDefault();
                }
            }

            function onUp(e) {
                if (!isPointerDown) return;
                isPointerDown = false;
                card.classList.remove('dragging');
                if (pointerId !== null) {
                    try { card.releasePointerCapture(pointerId); } catch (err) { /* noop */ }
                }
                pointerId = null;
            }

            card.addEventListener('pointerdown', onDown);
            card.addEventListener('pointermove', onMove);
            card.addEventListener('pointerup', onUp);
            card.addEventListener('pointercancel', onUp);

            card.addEventListener('click', function (e) {
                if (dragged) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);

            card.addEventListener('dragstart', function (e) { e.preventDefault(); });

            let lastFrame = performance.now();
            function loop(now) {
                const frameDt = Math.min(50, now - lastFrame);
                lastFrame = now;

                let needsUpdate = false;

                if (introActive) {
                    if (introStart === null) introStart = now;
                    const t = (now - introStart) / 1000;
                    if (t * 1000 >= INTRO_DURATION_MS) {
                        introActive = false;
                        baseX = 0;
                        baseY = 0;
                    } else {
                        const env = Math.exp(-t * INTRO_DECAY);
                        const TAU = Math.PI * 2;
                        baseY = INTRO_AMP_Y * env * Math.sin(t * INTRO_FREQ_Y * TAU);
                        baseX = INTRO_AMP_X * env * Math.sin(t * INTRO_FREQ_X * TAU);
                    }
                    needsUpdate = true;
                }

                if (!isPointerDown) {
                    const speed = Math.hypot(velX, velY);
                    if (speed > 0.0008) {
                        // Inertia decays on the base rotation, leaving the card wherever it lands.
                        baseX += velX * frameDt;
                        baseY += velY * frameDt;
                        const decay = Math.pow(FRICTION, frameDt / 16);
                        velX *= decay;
                        velY *= decay;
                        needsUpdate = true;
                    }
                }

                if (needsUpdate) applyTransform();
                requestAnimationFrame(loop);
            }

            requestAnimationFrame(loop);

            window.addEventListener('blur', function () {
                if (isPointerDown) {
                    isPointerDown = false;
                    card.classList.remove('dragging');
                    pointerId = null;
                }
            });
        })();
    </script>
</body>

</html>
